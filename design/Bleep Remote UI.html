document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

s Mono',monospace;font-size:12px;color:#ece9e4\">line<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#9b9a96\">#182126 · 0x1904<\u002Fspan><span style=\"font-size:11px;color:#8d8c88\">1 px borders<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:#0c0d0e;border:1px solid #1c1e21\"><div style=\"width:36px;height:36px;flex:none;border-radius:8px;background:#50D9EF;border:1px solid #2a2d31\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#ece9e4\">accent<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#9b9a96\">#50D9EF · 0x56DD<\u002Fspan><span style=\"font-size:11px;color:#8d8c88\">Active border, fills<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:#0c0d0e;border:1px solid #1c1e21\"><div style=\"width:36px;height:36px;flex:none;border-radius:8px;background:#0C2024;border:1px solid #2a2d31\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#ece9e4\">accent-tint<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#9b9a96\">#0C2024 · 0x0904<\u002Fspan><span style=\"font-size:11px;color:#8d8c88\">Selected card fill<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:#0c0d0e;border:1px solid #1c1e21\"><div style=\"width:36px;height:36px;flex:none;border-radius:8px;background:#2D91A1;border:1px solid #2a2d31\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#ece9e4\">accent-edge<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#9b9a96\">#2D91A1 · 0x2C94<\u002Fspan><span style=\"font-size:11px;color:#8d8c88\">Selected card border<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:#0c0d0e;border:1px solid #1c1e21\"><div style=\"width:36px;height:36px;flex:none;border-radius:8px;background:#EAF2F4;border:1px solid #2a2d31\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#ece9e4\">text<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#9b9a96\">#EAF2F4 · 0xEF9E<\u002Fspan><span style=\"font-size:11px;color:#8d8c88\">Primary text<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:#0c0d0e;border:1px solid #1c1e21\"><div style=\"width:36px;height:36px;flex:none;border-radius:8px;background:#93A3A8;border:1px solid #2a2d31\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#ece9e4\">text-2<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#9b9a96\">#93A3A8 · 0x9515<\u002Fspan><span style=\"font-size:11px;color:#8d8c88\">Secondary text<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px\">\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid #2a2d31\"><div style=\"font-size:14px;font-weight:700\">Not used<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#a9a7a2;text-wrap:pretty\">Shadows, glow, blur, text shadow, transparent fills and background gradients. The only exceptions are the colour wheel and colour-temperature bar on the light card, which are fixed images.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid #2a2d31\"><div style=\"font-size:14px;font-weight:700\">Allowed<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#a9a7a2;text-wrap:pretty\">Solid fills, 1 px borders, rounded corners up to 16 px, arcs for rings, and text. Corners and arcs are anti-aliased but cheap.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid #2a2d31\"><div style=\"font-size:14px;font-weight:700\">Selected state<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#a9a7a2;text-wrap:pretty\">A tinted fill plus a cyan border, with no extra layer, so changing selection redraws a single tile.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid #2a2d31\"><div style=\"font-size:14px;font-weight:700\">Modals<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#a9a7a2;text-wrap:pretty\">The low-battery sheet dims the screen once with a 60% black layer, then stays still. Swap it for a solid fill if that one frame matters.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid #2a2d31\"><div style=\"font-size:14px;font-weight:700\">Display setup<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#a9a7a2;text-wrap:pretty\">ILI9488 on the 8-bit 8080 bus, driven by the S3 i80 LCD peripheral. RGB565 is native (COLMOD 0x55, two bus writes per pixel), so no conversion. Two 1/10-screen buffers in internal RAM, DMA flush. A full frame is 307 KB, about 15 ms at 20 MHz; LVGL rendering is now the limit, so keep transitions short and redraw only what changes.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid #2a2d31\"><div style=\"font-size:14px;font-weight:700\">Fonts<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#a9a7a2;text-wrap:pretty\">Sora converted to LVGL bitmap fonts at 4 bpp, three or four sizes only. The 84 px clock uses a digits-only font to save flash.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div id=\"2c-light\" style=\"background:#121315;border:1px solid #212326;border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:26px\"><div style=\"display:flex;align-items:baseline;gap:14px;flex-wrap:wrap\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid oklch(0.78 0.12 210);color:oklch(0.78 0.12 210)\">2c · light<\u002Fdiv><div style=\"font-size:22px;font-weight:700\">Flat · Light theme<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#8d8c88\">Sora<\u002Fdiv><div style=\"font-size:14px;color:#a9a7a2;max-width:640px;line-height:1.5\">The same screens and rules on a cool off-white. Cards are white on a pale grey ground, separated by 1 px lines. The accent darkens to Deep Cyan so text and icons keep contrast on white. Every colour is opaque, as in the dark theme.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:40px;align-items:flex-start;padding:10px\"><div style=\"display:flex;flex-direction:column;gap:14px;width:320px;flex:none\"><div style=\"width:320px;height:480px;flex:none;border-radius:14px;background:#F3F5F6;box-shadow:0 0 0 10px #050505,0 0 0 11px #222427;position:relative;overflow:hidden;display:flex;flex-direction:column;font-family:'Sora',sans-serif;color:#0E1416\"><div style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:12px;font-weight:600;color:#0E1416;opacity:.85\"><span>21:40<\u002Fspan><div style=\"display:flex;align-items:center;gap:8px\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;display:block\"><path d=\"M2.5 9 tom:1px solid #1c1e21;font-size:13px;line-height:1.5\"><span style=\"color:#9b9a96\">Keyboard<\u002Fspan><span style=\"color:#ece9e4\">320 × 203 px (number pad 320 × 235)<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:10px 0;border-bottom:1px solid #1c1e21;font-size:13px;line-height:1.5\"><span style=\"color:#9b9a96\">Padding<\u002Fspan><span style=\"color:#ece9e4\">3 px outside, 4 px between keys, 5 px between rows<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:10px 0;border-bottom:1px solid #1c1e21;font-size:13px;line-height:1.5\"><span style=\"color:#9b9a96\">Rows<\u002Fspan><span style=\"color:#ece9e4\">44 px (number pad 52 px)<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:10px 0;border-bottom:1px solid #1c1e21;font-size:13px;line-height:1.5\"><span style=\"color:#9b9a96\">Units<\u002Fspan><span style=\"color:#ece9e4\">20 per row. Letters 2, shift and backspace 3, space 10, spacers 1<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:10px 0;border-bottom:1px solid #1c1e21;font-size:13px;line-height:1.5\"><span style=\"color:#9b9a96\">Letter key<\u002Fspan><span style=\"color:#ece9e4\">≈ 28 × 44 px, radius 8<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:10px 0;border-bottom:1px solid #1c1e21;font-size:13px;line-height:1.5\"><span style=\"color:#9b9a96\">Fonts<\u002Fspan><span style=\"color:#ece9e4\">Sora 21/600 (the Title font, reused), icon font as fallback. Mod labels 14/500 through the draw hook<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px\"><div style=\"display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid #2a2d31\"><div style=\"font-size:14px;font-weight:700\">One keyboard, four maps<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#a9a7a2;text-wrap:pretty\">Create a single lv_keyboard on the top layer and reuse it for every input. Each input sets its mode and its lv_textarea, then shows the keyboard.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid #2a2d31\"><div style=\"font-size:14px;font-weight:700\">Shift<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#a9a7a2;text-wrap:pretty\">One tap gives one capital. A double tap locks caps until the next tap. The latched state uses the shift-on style.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid #2a2d31\"><div style=\"font-size:14px;font-weight:700\">Popovers<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#a9a7a2;text-wrap:pretty\">Letter keys only, so holding backspace or space doesn't open one. Each press redraws the key and its popover, about 42 × 93 px.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid #2a2d31\"><div style=\"font-size:14px;font-weight:700\">Showing the keyboard<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#a9a7a2;text-wrap:pretty\">Appear instantly and shrink the screen above it with lv_obj_set_height, so the focused field stays in view without scrolling.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid #2a2d31\"><div style=\"font-size:14px;font-weight:700\">Hit area<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#a9a7a2;text-wrap:pretty\">Gaps between keys are dead zones in lv_buttonmatrix, so keep them at 4 px. Letter keys are narrower than the 44 px rule; the popover confirms each press. Number pad keys meet it.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid #2a2d31\"><div style=\"font-size:14px;font-weight:700\">Redraw cost<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#a9a7a2;text-wrap:pretty\">A key press redraws about 4,000 px. Switching map redraws the keyboard only: 130 KB, about 7 ms on the 8080 bus at 20 MHz.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid #2a2d31\"><div style=\"font-size:14px;font-weight:700\">Text area rules<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#a9a7a2;text-wrap:pretty\">Password mode with lv_textarea_set_password_show_time 1500. One-line mode for every field. The number pad sets accepted characters to 0–9 and a maximum length.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid #2a2d31\"><div style=\"font-size:14px;font-weight:700\">Enter<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#a9a7a2;text-wrap:pretty\">Fires LV_EVENT_READY on the keyboard. The handler validates the field, then hides the keyboard. Back (the hardware key) cancels.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px\"><div style=\"font-size:18px;font-weight:700\">Maps and setup<\u002Fdiv><div style=\"font-size:13px;line-height:1.5;color:#a9a7a2;max-width:860px\">The upper-case and symbol maps follow the same pattern as map_lower. BLP_SYM_SHIFT is the shift glyph in the Bleep icon font.<\u002Fdiv><pre style=\"margin:0;padding:20px;border-radius:14px;background:#0c0d0e;border:1px solid #1c1e21;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;color:#cfccc6;overflow-x:auto;white-space:pre\">// LVGL v9. In v8: lv_btnmatrix_ctrl_t and LV_BTNMATRIX_CTRL_*.\n#define KEY(w)   ((w) | LV_BUTTONMATRIX_CTRL_POPOVER)\n#define MOD(w)   ((w) | LV_BUTTONMATRIX_CTRL_CHECKED | LV_BUTTONMATRIX_CTRL_NO_REPEAT | LV_BUTTONMATRIX_CTRL_CLICK_TRIG)\n#define BKSP(w)  ((w) | LV_BUTTONMATRIX_CTRL_CHECKED)\n#define GAP(w)   ((w) | LV_BUTTONMATRIX_CTRL_HIDDEN)\n#define SHIFT(w) (MOD(w) | LV_BUTTONMATRIX_CTRL_CUSTOM_1)\n#define ENTER(w) (MOD(w) | LV_BUTTONMATRIX_CTRL_CUSTOM_2)\n\nstatic const char *map_lower[] = {\n  \"q\",\"w\",\"e\",\"r\",\"t\",\"y\",\"u\",\"i\",\"o\",\"p\",\"\\n\",\n  \" \",\"a\",\"s\",\"d\",\"f\",\"g\",\"h\",\"j\",\"k\",\"l\",\" \",\"\\n\",\n  BLP_SYM_SHIFT,\"z\",\"x\",\"c\",\"v\",\"b\",\"n\",\"m\",LV_SYMBOL_BACKSPACE,\"\\n\",\n  \"123\",\",\",\" \",\".\",LV_SYMBOL_OK,\"\"\n};\nstatic const lv_buttonmatrix_ctrl_t ctrl_lower[] = {\n  KEY(2),KEY(2),KEY(2),KEY(2),KEY(2),KEY(2),KEY(2),KEY(2),KEY(2),KEY(2),\n  GAP(1),KEY(2),KEY(2),KEY(2),KEY(2),KEY(2),KEY(2),KEY(2),KEY(2),KEY(2),GAP(1),\n  SHIFT(3),KEY(2),KEY(2),KEY(2),KEY(2),KEY(2),KEY(2),KEY(2),BKSP(3),\n  MOD(3),2,10,2,ENTER(3)\n};\nstatic const char *map_num[] = {\n  \"1\",\"2\",\"3\",\"\\n\", \"4\",\"5\",\"6\",\"\\n\", \"7\",\"8\",\"9\",\"\\n\",\n  LV_SYMBOL_BACKSPACE,\"0\",LV_SYMBOL_OK,\"\"\n};\nstatic const lv_buttonmatrix_ctrl_t ctrl_num[] = {\n  1,1,1, 1,1,1, 1,1,1, BKSP(1),1,ENTER(1)\n};\n\nvoid blp_keyboard_create(void) {\n  kb = lv_keyboard_create(lv_layer_top());\n  lv_obj_set_size(kb, 320, 203);\n  lv_obj_align(kb, LV_ALIGN_BOTTOM_MID, 0, 0);\n  lv_keyboard_set_map(kb, LV_KEYBOARD_MODE_TEXT_LOWER, map_lower, ctrl_lower);\n  lv_keyboard_set_map(kb, LV_KEYBOARD_MODE_TEXT_UPPER, map_upper, ctrl_upper);\n  lv_keyboard_set_map(kb, LV_KEYBOARD_MODE_SPECIAL,    map_sym,   ctrl_sym);\n  lv_keyboard_set_map(kb, LV_KEYBOARD_MODE_NUMBER,     map_num,   ctrl_num);\n  lv_keyboard_set_popovers(kb, true);\n\n  // Own handler: maps shift, 123, #+= and abc to modes.\n  lv_obj_remove_event_cb(kb, lv_keyboard_def_event_cb);\n  lv_obj_add_event_cb(kb, blp_kb_event_cb, LV_EVENT_VALUE_CHANGED, NULL);\n  // Shift-on and enter colours, mod label font.\n  lv_obj_add_flag(kb, LV_OBJ_FLAG_SEND_DRAW_TASK_EVENTS);\n  lv_obj_add_event_cb(kb, blp_kb_draw_cb, LV_EVENT_DRAW_TASK_ADDED, NULL);\n\n  lv_obj_add_style(kb, &amp;st_kb, 0);                                  // bg, pad 3, row 5, column 4\n  lv_obj_add_style(kb, &amp;st_key, LV_PART_ITEMS);                     // key colour, radius 8, Sora 21/600\n  lv_obj_add_style(kb, &amp;st_key_pressed, LV_PART_ITEMS | LV_STATE_PRESSED);\n  lv_obj_add_style(kb, &amp;st_key_mod, LV_PART_ITEMS | LV_STATE_CHECKED);\n  lv_obj_add_flag(kb, LV_OBJ_FLAG_HIDDEN);\n}<\u002Fpre><\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {};\n  }\n}\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
